root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve", "--config", "config.yaml"]
  bin = "./tmp/ipmitool-microservice"
  cmd = "go build -o ./tmp/ipmitool-microservice ."
  delay = 1000
  exclude_dir = [".git", ".idea", ".vscode", ".cache", "tmp", "vendor", "testdata", "bin", "build", "dist", "coverage"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum", "config.yaml"]
  kill_delay = "4s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["goimports -local ipmitool-microservice -w main.go internal", "golangci-lint run ./..."]
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
